<title>Lightning Recall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a cold instrument panel (rail + one working column, hairlines, mono micro-labels) under a strip of subject tabs.
   The subject in view lends its colour to one faceted gradient surface, which carries the deck's lightning bolt;
   the bolt reaches further toward the ground as the deck is learned. */
:root{
  --bg:#0a0e14;--panel:#0f151e;--raise:#161e2a;--sunk:#06090d;--line:#1d2836;--line2:#2c3b50;--fg:#e8edf4;--fg2:#a8b4c5;--mute:#6d7c92;--good:#3fd39b;--good-bg:#0e2a22;--bad:#ff5c75;--bad-bg:#2d1118;--warn:#f0b454;--warn-bg:#2a2010;--scrim:rgba(4,6,10,.66);--ink:#ff7d95;color-scheme:dark;
  --a1:#f0476a;--a2:#6b4bff;--on:#ffffff;--onx:#0a0e14;
  --grad:linear-gradient(135deg,var(--a1),var(--a2));
  --fd:"Big Shoulders Display","Barlow Condensed","Arial Narrow","Helvetica Neue",Impact,sans-serif;
  --fb:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fm:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#edf1f5;--panel:#f6f8fb;--raise:#ffffff;--sunk:#e4e9ef;--line:#d3dbe5;--line2:#b9c5d3;--fg:#0e1620;--fg2:#3d4b5e;--mute:#64748a;--good:#0c8f61;--good-bg:#dff3ea;--bad:#d42a48;--bad-bg:#fbe3e7;--warn:#a56a10;--warn-bg:#f8ecd3;--scrim:rgba(20,28,40,.42);--ink:#c8234a;color-scheme:light;}}
:root[data-theme="light"]{--bg:#edf1f5;--panel:#f6f8fb;--raise:#ffffff;--sunk:#e4e9ef;--line:#d3dbe5;--line2:#b9c5d3;--fg:#0e1620;--fg2:#3d4b5e;--mute:#64748a;--good:#0c8f61;--good-bg:#dff3ea;--bad:#d42a48;--bad-bg:#fbe3e7;--warn:#a56a10;--warn-bg:#f8ecd3;--scrim:rgba(20,28,40,.42);--ink:#c8234a;color-scheme:light;}
:root.look-dark{--bg:#0a0e14;--panel:#0f151e;--raise:#161e2a;--sunk:#06090d;--line:#1d2836;--line2:#2c3b50;--fg:#e8edf4;--fg2:#a8b4c5;--mute:#6d7c92;--good:#3fd39b;--good-bg:#0e2a22;--bad:#ff5c75;--bad-bg:#2d1118;--warn:#f0b454;--warn-bg:#2a2010;--scrim:rgba(4,6,10,.66);--ink:#ff7d95;color-scheme:dark;}
:root.look-light{--bg:#edf1f5;--panel:#f6f8fb;--raise:#ffffff;--sunk:#e4e9ef;--line:#d3dbe5;--line2:#b9c5d3;--fg:#0e1620;--fg2:#3d4b5e;--mute:#64748a;--good:#0c8f61;--good-bg:#dff3ea;--bad:#d42a48;--bad-bg:#fbe3e7;--warn:#a56a10;--warn-bg:#f8ecd3;--scrim:rgba(20,28,40,.42);--ink:#c8234a;color-scheme:light;}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--fb);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,p,dl,dd,ul,ol{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg{display:block}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.grow{flex:1;min-width:0}
.lbl{font:500 11px/1.25 var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.fg2{color:var(--fg2)}

/* ---------- shell ---------- */
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
.rail{display:none}
.top{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg)}
.main{min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:var(--panel);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;height:58px;color:var(--mute);text-decoration:none;font:500 9.5px/1 var(--fm);letter-spacing:.12em;text-transform:uppercase}
.tabs a .i{width:20px;height:20px}
.tabs a[aria-current="page"]{color:var(--fg)}
.tabs a[aria-current="page"] .i{color:var(--ink)}
.app.focus .top,.app.focus .tabs,.app.focus .subbar{display:none}

.logo{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:var(--r)}
.logo svg{width:30px;height:30px}
.rail .logo{width:46px;height:46px;margin-left:4px}
.rail .logo svg{width:38px;height:38px}
/* subject tabs: one per subject, each in its own colour */
.subbar{display:none}
.subs{display:flex;align-items:center;gap:6px;min-width:0;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
.subs::-webkit-scrollbar{display:none}
.stab{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--line2);border-radius:var(--r);color:var(--fg2);font:500 11.5px/1 var(--fm);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;transition:background .12s,color .12s,border-color .12s}
.stab:hover{border-color:var(--mute);color:var(--fg)}
.stab i,.chip.sub i,.sj-row i{flex:none;display:block;width:9px;height:14px;background:linear-gradient(160deg,var(--c),var(--c2));clip-path:polygon(62% 0,0 58%,44% 58%,30% 100%,100% 38%,56% 38%)}
.stab.on{background:linear-gradient(135deg,var(--c,var(--fg)),var(--c2,var(--fg)));border-color:transparent;color:var(--co,var(--bg))}
.stab.on i{background:var(--co)}
.stab.add{padding:0 9px;border-style:dashed}
.stab .i{width:15px;height:15px}
.chip.sub[aria-pressed="true"]{background:linear-gradient(135deg,var(--c),var(--c2));border-color:transparent;color:var(--co)}
.chip.sub[aria-pressed="true"] i{background:var(--co)}
.sj-row{display:flex;align-items:center;gap:10px}
.sj-prev{display:flex;align-items:center;gap:10px;min-height:60px;padding:10px 18px;background:linear-gradient(135deg,var(--c),var(--c2));color:var(--co);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.sj-prev b{font:800 27px/1 var(--fd);text-transform:uppercase;letter-spacing:.03em;overflow-wrap:anywhere}
.sj-prev .i{width:22px;height:22px;fill:currentColor;stroke:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line2);border-radius:var(--r);font:500 12px/1 var(--fm);color:var(--fg2);font-variant-numeric:tabular-nums}
.pill .i{width:14px;height:14px;color:var(--ink)}
.sync{display:flex;align-items:center;gap:7px;font:500 10px/1.2 var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--mute);flex:none}
.sync.ok i{background:var(--good)}.sync.busy i{background:var(--warn)}.sync.bad i{background:var(--bad)}

@media (min-width:900px){
  .app{grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .top,.tabs{display:none}
  .rail{grid-column:1;grid-row:1 / span 2}
  .main{grid-column:2;grid-row:2}
  .subbar{display:block;grid-column:2;grid-row:1;padding:12px 28px;padding-right:max(28px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
  .rail{display:flex;flex-direction:column;gap:24px;min-height:0;overflow-y:auto;padding:22px 14px 16px;padding-left:max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--panel)}
  .wrap{padding-block:28px 56px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
}
@media (min-width:1280px){.app.chat-open .main{padding-right:460px}.app.chat-open.chat-wide .main{padding-right:0}}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{position:relative;display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:var(--r);color:var(--fg2);text-decoration:none;font:500 12px/1 var(--fm);letter-spacing:.14em;text-transform:uppercase}
.nav a:hover{color:var(--fg);background:var(--raise)}
.nav a[aria-current="page"]{color:var(--fg);background:var(--raise)}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;background:var(--grad)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:14px}
.rank{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.rank canvas{width:64px;height:64px;color:var(--fg2)}
.rank b{display:block;font:700 22px/1 var(--fd);text-transform:uppercase;letter-spacing:.04em}
.rank .meter{margin:8px 0 6px}
.rank .num{display:block;font-size:11px;color:var(--mute);white-space:nowrap}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border:1px solid var(--line2);border-radius:var(--r);background:transparent;color:var(--fg);font:600 13px/1 var(--fb);letter-spacing:.02em;white-space:nowrap;text-decoration:none;transition:background .12s,border-color .12s,transform .08s,filter .12s}
.btn:hover{background:var(--raise);border-color:var(--mute)}
.btn:active{transform:translateY(1px)}
.btn .i{width:16px;height:16px}
.btn.pri{background:var(--grad);border-color:transparent;color:var(--on)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.lg{min-height:48px;padding:0 22px;font-size:14px}
.btn.sm{min-height:34px;padding:0 11px;font-size:12px}
.btn.ghost{border-color:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn[disabled]{opacity:.42;pointer-events:none}
.link{color:var(--fg2);font-size:13px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2);min-height:32px}
.link:hover{color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:36px;max-width:100%;padding:0 13px;border:1px solid var(--line2);border-radius:var(--r);color:var(--fg2);font:500 11.5px/1.15 var(--fm);letter-spacing:.07em;text-transform:uppercase;transition:background .12s,color .12s,border-color .12s}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{border-color:var(--mute);color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip[disabled]{opacity:.4;pointer-events:none}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.inp,.ta{width:100%;background:var(--sunk);border:1px solid var(--line2);border-radius:var(--r);padding:11px 12px;font:16px/1.4 var(--fb);color:var(--fg)}
.ta{min-height:132px;resize:vertical}
.inp:focus,.ta:focus{outline:0;border-color:var(--fg2)}
.inp::placeholder,.ta::placeholder{color:var(--mute)}
.meter{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--grad);border-radius:2px;transition:width .4s ease-out}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2,.h2{font:700 23px/1 var(--fd);text-transform:uppercase;letter-spacing:.035em}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.page-h h1{font:800 clamp(34px,6vw,52px)/.92 var(--fd);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance;overflow-wrap:anywhere}
.note{font-size:13.5px;color:var(--fg2);max-width:62ch}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line2);border-radius:var(--r);font-size:13px;color:var(--fg2);background:var(--panel)}
.banner .i{color:var(--warn);margin-top:1px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;display:flex;min-height:308px;background:var(--grad);color:var(--on);clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,28px 100%,0 calc(100% - 28px))}
.hero-in{position:relative;z-index:2;width:100%;min-width:0;padding:26px 24px 26px 26px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px}
.hero .lbl{color:color-mix(in srgb,var(--on) 76%,transparent)}
.hero-name{font:800 clamp(42px,8.6vw,86px)/.88 var(--fd);text-transform:uppercase;letter-spacing:.005em;text-wrap:balance;overflow-wrap:anywhere;max-width:15ch}
.hero-sub{max-width:46ch;font-size:15px;color:color-mix(in srgb,var(--on) 86%,transparent)}
.hero-art{position:absolute;z-index:1;right:-7%;top:50%;width:min(64%,460px);aspect-ratio:1;max-width:100%;transform:translateY(-50%);color:var(--on);opacity:.5;pointer-events:none}
.hero-ghost{position:absolute;z-index:1;right:22px;top:2px;font:800 clamp(84px,17vw,176px)/.92 var(--fd);letter-spacing:-.02em;color:var(--on);opacity:.17;pointer-events:none;font-variant-numeric:tabular-nums}
.hero-ghost i{font-style:normal;font-size:.48em;margin-left:.04em}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px}
.stats dt{font:500 10.5px/1.2 var(--fm);letter-spacing:.14em;text-transform:uppercase;opacity:.74}
.stats dd{margin-top:4px;font:700 30px/1 var(--fd);font-variant-numeric:tabular-nums}
.stats dd small{font-size:.56em;font-weight:600;opacity:.7}
.hero-cta{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.hero .btn{color:var(--on);border-color:color-mix(in srgb,var(--on) 46%,transparent)}
.hero .btn:hover{background:color-mix(in srgb,var(--on) 14%,transparent);border-color:var(--on)}
.hero .btn.go{background:var(--on);border-color:var(--on);color:var(--onx)}
.hero .btn.go:hover{filter:brightness(.94)}
@media (max-width:640px){.hero-art{width:88%;right:-30%;opacity:.34}.hero-ghost{right:14px}}

/* ---------- home ---------- */
.home{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
.side{display:flex;flex-direction:column;gap:22px;min-width:0}
.duo{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
@media (min-width:1120px){
  .home{grid-template-columns:minmax(0,1fr) 316px;align-items:start}
  .home>.side{grid-column:2;grid-row:1 / span 4}
  .home>.hero,.home>.duo,.home>.decks,.home>.how,.home>.over{grid-column:1}
}
.goal{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center}
.ring{position:relative;width:76px;height:76px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .r0{stroke:var(--line)}
.ring .r1{stroke:url(#ringgrad);stroke-linecap:round;transition:stroke-dashoffset .5s ease-out}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 26px/1 var(--fd);font-variant-numeric:tabular-nums}
.goal .big{font:700 28px/1 var(--fd);text-transform:uppercase;letter-spacing:.02em;margin:5px 0 4px}
.goal .big small{font:400 12.5px/1 var(--fb);text-transform:none;letter-spacing:0;color:var(--fg2)}
.goal-lvl{grid-column:1 / -1;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding-top:12px;border-top:1px solid var(--line)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:2px}
.row:last-child{padding-bottom:2px}
.row-t{font:700 19px/1.05 var(--fd);text-transform:uppercase;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-s{grid-column:1;font:400 11px/1.3 var(--fm);color:var(--mute);letter-spacing:.04em}
.row-r{grid-row:1 / span 2;grid-column:2;display:flex;align-items:center;gap:10px}
.score{font:500 17px/1 var(--fm);font-variant-numeric:tabular-nums;white-space:nowrap}
.score .g{color:var(--good)}.score .b{color:var(--bad)}.score i{font-style:normal;color:var(--mute);margin:0 .28em}
.topic{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.topic:first-child{border-top:0;padding-top:2px}
.topic-n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topic .meter{grid-column:1 / -1}
.topic .num{font-size:12px;color:var(--fg2)}
.bars{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;align-items:end;height:66px}
.bars i{display:block;min-height:2px;background:var(--line2);border-radius:1px}
.bars i.on{background:var(--fg2)}
.bars i.today{background:var(--grad)}
.bars-x{display:flex;justify-content:space-between;margin-top:7px}
.deckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.deck{position:relative;display:flex;flex-direction:column;gap:9px;min-width:0;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);transition:border-color .12s,background .12s}
.deck:hover{border-color:var(--mute)}
.deck.on{border-color:var(--fg2);background:var(--raise)}
.deck canvas{width:58px;height:58px;color:var(--fg2)}
.deck b{font:700 20px/1 var(--fd);text-transform:uppercase;letter-spacing:.03em;overflow-wrap:anywhere}
.deck .lbl{font-size:10px}
.deck.add{align-items:center;justify-content:center;border-style:dashed;color:var(--fg2);min-height:150px}
.over{gap:18px}
.subgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:14px}
.subcard{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;min-width:0;min-height:172px;padding:16px;background:linear-gradient(135deg,var(--c),var(--c2));color:var(--co);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));transition:filter .12s,transform .08s}
.subcard:hover{filter:brightness(1.09)}
.subcard:active{transform:translateY(1px)}
.subcard:focus-visible{outline:0;box-shadow:inset 0 0 0 3px var(--co)}
.subcard canvas{position:absolute;right:-6px;top:-4px;width:124px;height:150px;color:var(--co);opacity:.55;pointer-events:none}
.subcard .lbl{position:relative;color:color-mix(in srgb,var(--co) 76%,transparent)}
.subcard b{position:relative;max-width:11ch;font:800 34px/.9 var(--fd);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.subcard-s{position:relative;display:flex;flex-wrap:wrap;gap:4px 14px;font:500 11px/1.2 var(--fm);letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--co) 80%,transparent)}
.subcard-s em{font-style:normal;color:var(--co)}
.subcard.plain{--co:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);clip-path:none}
.subcard.plain canvas{color:var(--fg2)}
.how{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.how .card b{display:block;font:700 22px/1 var(--fd);text-transform:uppercase;letter-spacing:.03em;margin:10px 0 6px}
.how .card p{font-size:13.5px;color:var(--fg2)}
.boot{min-height:60vh;display:grid;place-items:center;text-align:center}
.boot canvas{width:120px;height:120px;color:var(--fg2);margin:0 auto 18px;animation:blink 1.6s ease-in-out infinite}

/* ---------- study ---------- */
.setup{max-width:760px;display:flex;flex-direction:column;gap:22px}
.setup .sec{gap:10px}
.setup-sum{display:flex;flex-wrap:wrap;gap:8px 22px;font:400 12px/1.3 var(--fm);color:var(--fg2);letter-spacing:.05em;text-transform:uppercase}
.setup-sum b{color:var(--fg);font-weight:500}
.run{max-width:780px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.run-top{display:flex;align-items:center;gap:10px}
.run-mid{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--fg2)}
.run-mid .meter{flex:1}
.q{position:relative;display:flex;flex-direction:column;gap:16px;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);animation:qin .18s ease-out}
.q-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.tag{font:500 10px/1 var(--fm);letter-spacing:.12em;text-transform:uppercase;padding:4px 6px;border:1px solid var(--line2);border-radius:3px;color:var(--fg2)}
.q-text{font:500 clamp(19px,2.7vw,25px)/1.34 var(--fb);text-wrap:pretty;overflow-wrap:anywhere}
.opts{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;min-height:58px;padding:12px 14px;background:var(--raise);border:1px solid var(--line2);border-radius:var(--r);font-size:15.5px;line-height:1.35;overflow-wrap:anywhere;transition:border-color .12s,background .12s,transform .08s,opacity .2s}
.opt kbd{flex:none;display:grid;place-items:center;width:24px;height:24px;border:1px solid var(--line2);border-radius:4px;font:500 11px/1 var(--fm);color:var(--mute)}
.opt:hover{border-color:var(--mute)}
.opt:active{transform:scale(.99)}
.opts.locked .opt{pointer-events:none}
.opt.ok{border-color:var(--good);background:var(--good-bg);animation:pop .3s ease-out}
.opt.ok kbd{background:var(--good);border-color:var(--good);color:var(--good-bg)}
.opt.ok::after,.sa.ok::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 36%,color-mix(in srgb,var(--good) 34%,transparent) 50%,transparent 64%);transform:translateX(-100%);animation:sheen .65s .04s ease-out forwards}
.opt.no{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
.opt.no kbd{border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.46}
.sa{position:relative;overflow:hidden;display:flex;gap:10px;border-radius:var(--r)}
.sa input{flex:1;min-width:0;height:52px;padding:0 14px;background:var(--sunk);border:1px solid var(--line2);border-radius:var(--r);font-size:17px;transition:border-color .12s,background .12s}
.sa input:focus{outline:0;border-color:var(--fg2)}
.sa .btn{min-height:52px}
.sa.ok input{border-color:var(--good);background:var(--good-bg)}
.sa.no input{border-color:var(--bad);background:var(--bad-bg)}
.sa.mid input{border-color:var(--warn);background:var(--warn-bg)}
.sa.no{animation:shake .3s}
.fb{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line);animation:qin .16s ease-out}
.fb-head{display:flex;align-items:center;gap:10px;color:var(--fg2)}
.fb-head strong{font:800 27px/1 var(--fd);text-transform:uppercase;letter-spacing:.04em}
.fb-head .i{width:22px;height:22px;stroke-width:2.2}
.fb.ok .fb-head{color:var(--good)}.fb.no .fb-head{color:var(--bad)}.fb.mid .fb-head{color:var(--warn)}
.fb-xp{margin-left:auto;font:500 12px/1 var(--fm);color:var(--fg2);white-space:nowrap}
.fb-ans{font-size:16.5px;font-weight:600;overflow-wrap:anywhere}
.fb-ans .lbl{display:block;margin-bottom:3px}
.fb-note,.fb-why{color:var(--fg2);overflow-wrap:anywhere}
.fb-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.fb-acts .pri{min-width:120px}
.checking{display:flex;align-items:center;gap:10px;color:var(--fg2);font-size:14px}
.dots{display:inline-flex;gap:4px}
.dots i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.combo{position:absolute;top:-13px;right:14px;z-index:3;padding:5px 10px;background:var(--grad);color:var(--on);border-radius:3px;font:700 15px/1 var(--fd);letter-spacing:.08em;text-transform:uppercase;animation:combo 1.5s ease-out forwards;pointer-events:none}
.xp-float{position:fixed;z-index:65;pointer-events:none;font:700 24px/1 var(--fd);color:var(--good);animation:rise .9s ease-out forwards}
.streak-b{transition:transform .15s}
.streak-b.bump{animation:pop .3s ease-out}
.fin{max-width:780px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.fin-top{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.fin-art{position:absolute;right:-34px;top:50%;width:260px;height:260px;transform:translateY(-50%);color:var(--ink);opacity:.85;pointer-events:none}
.fin-score{font:800 clamp(72px,16vw,128px)/.86 var(--fd);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.fin-score .g{color:var(--good)}.fin-score .b{color:var(--bad)}.fin-score i{font-style:normal;color:var(--mute);margin:0 .12em}
.fin-top>:not(canvas){position:relative}
.fin .stats dd{font-size:28px}
@media (max-width:640px){.fin-art{opacity:.3;right:-90px}}
.miss{display:flex;flex-direction:column;gap:3px;padding:12px 0;border-top:1px solid var(--line)}
.miss:first-child{border-top:0}
.miss b{font-weight:600}
.miss s{color:var(--bad);text-decoration-thickness:1px}

/* ---------- library / learn ---------- */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item-q{font-weight:500;overflow-wrap:anywhere}
.item-a{grid-column:1;font-size:13px;color:var(--fg2);overflow-wrap:anywhere}
.item-r{grid-row:1 / span 2;grid-column:2;display:flex;gap:6px;align-items:center}
.lesson{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.lesson:first-child{border-top:0}
.lesson-n{grid-row:1 / span 2;font:700 30px/1 var(--fd);color:var(--mute);font-variant-numeric:tabular-nums;min-width:1.4em}
.lesson.done .lesson-n{color:var(--good)}
.lesson-t{font-weight:600;overflow-wrap:anywhere}
.lesson-g{grid-column:2;font-size:13px;color:var(--fg2);overflow-wrap:anywhere}
.lesson .btn{grid-row:1 / span 2;grid-column:3}
.drop{display:flex;flex-direction:column;gap:10px}
.drop.over .ta{border-color:var(--ink);border-style:dashed}
.files{display:flex;flex-wrap:wrap;gap:8px}
.file{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:6px 6px 6px 10px;border:1px solid var(--line2);border-radius:var(--r);font:400 12px/1.2 var(--fm);color:var(--fg2)}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file button{display:grid;place-items:center;width:22px;height:22px;border-radius:4px;color:var(--mute)}
.file button:hover{background:var(--raise);color:var(--fg)}
.file.err{border-color:var(--bad);color:var(--bad)}
.detect{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel)}
.build{max-width:640px;margin:0 auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding-top:8px}
.build canvas{width:210px;height:210px;color:var(--ink)}
.build-n{font:800 78px/.9 var(--fd);font-variant-numeric:tabular-nums}
.build-n small{font-size:.38em;color:var(--mute);font-weight:700;margin-left:.2em}
.build-log{width:100%;display:flex;flex-direction:column;gap:6px;min-height:104px;text-align:left}
.build-log p{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);font-size:13px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;animation:qin .2s ease-out}
.build-log p:first-child{color:var(--fg);border-color:var(--line2)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{display:flex;flex-direction:column;gap:6px;align-items:center;font:500 9.5px/1 var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.sw i{display:block;width:52px;height:38px;border-radius:var(--r);border:1px solid var(--line2);outline:2px solid transparent;outline-offset:2px}
.sw[aria-pressed="true"] i{outline-color:var(--fg)}
.sw[aria-pressed="true"]{color:var(--fg)}
.color{display:flex;align-items:center;gap:8px;font:500 11px/1 var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--fg2)}
.color input{width:44px;height:36px;padding:2px;background:var(--sunk);border:1px solid var(--line2);border-radius:var(--r);cursor:pointer}
.prefs{max-width:760px;display:flex;flex-direction:column;gap:26px}
.pref{display:grid;gap:10px;padding-top:18px;border-top:1px solid var(--line)}
.pref:first-of-type{border-top:0;padding-top:0}
.pref h3{font:700 20px/1 var(--fd);text-transform:uppercase;letter-spacing:.04em}
.preview{height:64px;background:var(--grad);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));display:flex;align-items:center;padding:0 18px;color:var(--on);font:800 26px/1 var(--fd);letter-spacing:.06em;text-transform:uppercase}

/* ---------- Mr Claude ---------- */
.mc{position:fixed;inset:0 0 0 auto;z-index:40;width:min(460px,100%);display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);transform:translateX(103%);visibility:hidden;transition:transform .2s ease-out,visibility 0s .2s}
.mc.open{transform:none;visibility:visible;transition:transform .2s ease-out,visibility 0s}
.mc.wide{width:min(760px,100%)}
.mc-h{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line)}
.mc-h b{display:block;font:800 22px/1 var(--fd);letter-spacing:.06em;text-transform:uppercase}
.mc-h .lbl{margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-tools{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.mc-log{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px;display:flex;flex-direction:column;gap:16px}
.msg{min-width:0;max-width:100%;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;max-width:88%;padding:8px 12px;background:var(--raise);border:1px solid var(--line2);border-radius:var(--r);white-space:pre-wrap}
.msg.auto{align-self:center;text-align:center}
.msg .who{margin-bottom:6px}
.msg.err{color:var(--bad);font-size:13px}
.mc-empty{margin:auto 0;display:flex;flex-direction:column;gap:10px;color:var(--fg2);font-size:14px}
.mc-empty canvas{width:72px;height:72px;color:var(--ink)}
.prose{font-size:15px;line-height:1.55}
.prose p,.prose ul,.prose ol,.prose pre,.prose .tbl,.prose blockquote{margin:0 0 .75em}
.prose>:last-child{margin-bottom:0}
.prose h4{font:700 19px/1.1 var(--fd);text-transform:uppercase;letter-spacing:.04em;margin:1.1em 0 .45em}
.prose>h4:first-child{margin-top:0}
.prose ul,.prose ol{padding-left:1.3em}
.prose li{margin:.2em 0}
.prose code{font:.88em var(--fm);background:var(--sunk);padding:.1em .35em;border-radius:3px}
.prose pre{overflow-x:auto;background:var(--sunk);padding:10px 12px;border-radius:var(--r)}
.prose pre code{background:none;padding:0}
.prose .tbl{overflow-x:auto}
.prose table{border-collapse:collapse;font-size:13.5px}
.prose th,.prose td{border:1px solid var(--line2);padding:5px 9px;text-align:left;vertical-align:top}
.prose blockquote{padding-left:12px;border-left:2px solid var(--line2);color:var(--fg2)}
.prose hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.prose a{color:var(--ink)}
.mc-quick{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.mc-quick::-webkit-scrollbar{display:none}
.mc-quick .chip{flex:none;text-transform:none;letter-spacing:.01em;font:500 12.5px/1 var(--fb)}
.mc-form{display:flex;gap:8px;align-items:flex-end;padding:10px 12px 12px 16px;border-top:1px solid var(--line)}
.mc-form textarea{flex:1;min-width:0;height:46px;max-height:136px;resize:none;padding:11px 12px;background:var(--sunk);border:1px solid var(--line2);border-radius:var(--r);font:16px/1.4 var(--fb)}
.mc-form textarea:focus{outline:0;border-color:var(--fg2)}
.mc-form .btn{min-height:46px;width:46px;padding:0}

/* ---------- overlays ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);padding-top:env(safe-area-inset-top,0px)}
.sheet{width:min(580px,100%);max-height:94%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;background:var(--panel);border:1px solid var(--line2);border-bottom:0;border-radius:10px 10px 0 0;padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .18s ease-out}
.sheet h2{font:800 28px/1 var(--fd);text-transform:uppercase;letter-spacing:.04em}
.sheet-acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:4px}
@media (min-width:700px){.sheet-wrap{align-items:center;padding:24px}.sheet{border-bottom:1px solid var(--line2);border-radius:10px;padding:24px}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:70;max-width:min(92%,480px);padding:10px 14px;background:var(--fg);color:var(--bg);border-radius:var(--r);font-size:13.5px;font-weight:500;opacity:0;transform:translate(-50%,16px);transition:opacity .15s,transform .15s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;z-index:60;width:100%;height:100%;pointer-events:none}

/* ---------- motion: colour morph, 3D tilt and glare, cursor glow, hover, entrances ---------- */
@property --a1{syntax:'<color>';inherits:true;initial-value:#7a6bff}
@property --a2{syntax:'<color>';inherits:true;initial-value:#31c4ff}
:root{transition:--a1 .5s ease,--a2 .5s ease}
:root.calm{transition:none}
.app{position:relative;z-index:1}
#glow{position:fixed;left:0;top:0;z-index:0;width:680px;height:680px;margin:-340px 0 0 -340px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,color-mix(in srgb,var(--a1) 16%,transparent),transparent 66%);opacity:0;transform:translate3d(-999px,-999px,0);transition:opacity .5s;will-change:transform}
#glow.on{opacity:1}

/* surfaces that lean toward the cursor; --rx/--ry/--px/--py/--mx/--my are set from the pointer */
.hero,.subcard,.deck,.stab,.fin-top,.sj-prev{--rx:0deg;--ry:0deg;--px:0;--py:0;--lift:0px;transform:perspective(var(--tp,1000px)) rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--lift));transition:transform .55s cubic-bezier(.2,.8,.2,1),filter .15s,border-color .15s,background-color .15s,box-shadow .25s,color .15s}
.hero.tilting,.subcard.tilting,.deck.tilting,.stab.tilting,.fin-top.tilting,.sj-prev.tilting{transition:transform .1s linear,filter .15s,border-color .15s,background-color .15s,box-shadow .25s,color .15s;will-change:transform}
.stab{--tp:340px}.deck{--tp:620px;overflow:hidden}.subcard{--tp:760px}
.hero::after,.subcard::after,.deck::after,.fin-top::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.2),transparent 62%);opacity:0;transition:opacity .35s}
.deck::after,.fin-top::after{background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--a1) 22%,transparent),transparent 66%)}
.tilting::after{opacity:1}
/* layers inside a tilted surface slide against each other for depth */
.hero-art{--o:.5;opacity:var(--o);transform:translateY(-50%) translate3d(calc(var(--px)*-16px),calc(var(--py)*-12px),0);transition:transform .55s cubic-bezier(.2,.8,.2,1);animation:flicker 9s linear infinite}
.hero-ghost{transform:translate3d(calc(var(--px)*12px),calc(var(--py)*9px),0);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.hero-in{transform:translate3d(calc(var(--px)*4px),calc(var(--py)*3px),0);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.subcard canvas{transform:translate3d(calc(var(--px)*-9px),calc(var(--py)*-7px),0);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.subcard b{transform:translate3d(calc(var(--px)*5px),calc(var(--py)*4px),0);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.fin-art{transform:translateY(-50%) translate3d(calc(var(--px)*-12px),calc(var(--py)*-9px),0);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.tilting .hero-art,.tilting .hero-ghost,.tilting .hero-in,.tilting canvas,.tilting b,.tilting .fin-art{transition-duration:.1s;transition-timing-function:linear}
@media (max-width:640px){.hero-art{--o:.34}}
/* a spotlight in the accent colour follows the cursor across panels */
.card,.q{background-image:radial-gradient(360px circle at var(--sx,-600px) var(--sy,-600px),color-mix(in srgb,var(--a1) 11%,transparent),transparent 70%)}

/* subject tabs: the colour floods in on hover, the bolt jolts, the active tab glints */
.stab{position:relative;overflow:hidden}
.stab>*{position:relative;z-index:1}
.stab::before{content:"";position:absolute;inset:0 -14px;z-index:0;background:linear-gradient(135deg,var(--c,var(--fg2)),var(--c2,var(--fg2)));opacity:0;transform:translateX(-104%) skewX(-18deg);transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .25s}
.stab.on::before{display:none}
.stab.on::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.34) 50%,transparent 62%);transform:translateX(-120%);animation:glint 4.2s ease-in-out infinite}
.subbar,.top{position:relative}
.app.zapped .subbar::after,.app.zapped .top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--grad);transform-origin:0 50%;animation:sweep .72s cubic-bezier(.2,.8,.2,1) both}
.logo svg{transition:filter .2s}
.app.zapped .logo svg{animation:zap .5s ease-out}

/* rail and bottom navigation */
.nav a .i{transition:transform .22s cubic-bezier(.2,.8,.2,1),color .15s}
.nav a::before{content:"";position:absolute;left:-14px;top:50%;width:3px;height:0;background:var(--grad);transition:height .25s cubic-bezier(.2,.8,.2,1),top .25s cubic-bezier(.2,.8,.2,1)}
.nav a[aria-current="page"]::before{top:8px;bottom:auto;height:26px}
.tabs a{position:relative;overflow:hidden}
.tabs a .i{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.tabs a::before{content:"";position:absolute;top:0;left:50%;width:0;height:2px;background:var(--grad);transition:width .25s cubic-bezier(.2,.8,.2,1),left .25s cubic-bezier(.2,.8,.2,1)}
.tabs a[aria-current="page"]::before{left:26%;width:48%}
.tabs a[aria-current="page"] .i{transform:translateY(-1px) scale(1.1)}
.tabs a:active .i{transform:scale(.84)}

/* controls */
.btn{position:relative;overflow:hidden}
.btn.pri::after,.btn.go::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 36%,rgba(255,255,255,.4) 50%,transparent 64%);transform:translateX(-120%)}
.btn.go::after{background:linear-gradient(105deg,transparent 36%,color-mix(in srgb,var(--a1) 34%,transparent) 50%,transparent 64%)}
.btn:active{transform:translateY(1px) scale(.985)}
.chip{position:relative;overflow:hidden;transition:background .12s,color .12s,border-color .12s,transform .15s cubic-bezier(.2,.8,.2,1)}
.opt{transition:border-color .15s,background .15s,transform .18s cubic-bezier(.2,.8,.2,1),opacity .2s,box-shadow .2s}
.opt kbd{transition:background .15s,color .15s,border-color .15s}
.lesson-n{transition:color .15s,transform .2s cubic-bezier(.2,.8,.2,1)}
.rip{position:absolute!important;z-index:2!important;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:currentColor;opacity:.3;transform:scale(0);pointer-events:none;animation:rip .58s ease-out forwards}
@media (hover:hover) and (pointer:fine){
  .stab:hover{--lift:-2px;color:var(--fg);border-color:var(--c,var(--mute));box-shadow:0 8px 20px -10px var(--c,transparent)}
  .stab.on:hover{color:var(--co,var(--bg))}
  .stab:hover::before{opacity:.26;transform:translateX(0) skewX(-18deg)}
  .stab:hover i{animation:zap .5s ease-out}
  .subcard:hover{--lift:-5px}
  .deck:hover{--lift:-4px;border-color:var(--ink)}

function md(src) {

function cloudBackend(db, uid) {
  const base = 'data/users/' + uid;
  const chains = {};
  const run = (path, fn) => { const p = (chains[path] || Promise.resolve()).then(fn, fn); chains[path] = p.catch(() => {}); return p; };
  const retry = async fn => {
    try { return await fn(); }
    catch (e) { if (e && e.code === 'unavailable') { await sleep(700 + Math.random() * 900); return fn(); } throw e; }
  };
  const sub = (did, col) => db.doc(base + '/d_' + did).collection(col);

    // with `full`: merge into the stored document, creating it from full() when it does not exist yet
    put(key, data, full) {
      const ref = db.doc(base + '/' + key);
      return run(key, () => retry(async () => {
        if (!full) return ref.set(data);
        try { await ref.update(data); }
        catch (e) { if (!e || e.code !== 'invalid_argument') throw e; await ref.set(full()); }
      }));
    },
    del(key) { return run(key, () => retry(() => db.doc(base + '/' + key).delete())); },

    subPut(did, col, id, data) { return run(did + '/' + col + '/' + id, () => retry(() => sub(did, col).doc(id).set(data))); },
    subDel(did, col, id) { return run(did + '/' + col + '/' + id, () => retry(() => sub(did, col).doc(id).delete())); },
    listen(next, fail) {
      return db.collection(base).onSnapshot(snap => {

function parseCSV(text, sep) {

    else if (ch !== '\r') cell += ch;

}
function parseTable(text, hint) {

  const uniform = r => r.length >= 3 && r[0].length >= 2 && r[0].length <= 8 && r.every(x => x.length === r[0].length);

    header = lines.some(l => /^\s*\|?[\s:|-]*-{2,}[\s:|-]*\|?\s*$/.test(l));
    rows = lines.filter(l => !/^\s*\|?[\s:|-]*-{2,}[\s:|-]*\|?\s*$/.test(l)).map(l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()));

  } else if (hint === 'csv' || (share(l => l.includes(',')) >= 0.9 && src.length / lines.length < 160 && uniform(parseCSV(src, ',')))) {
    rows = parseCSV(src, ',');
  } else if (share(l => l.includes(';')) >= 0.9 && new Set(lines.map(l => l.split(';').length)).size === 1) {
    rows = parseCSV(src, ';');

    const re = /^\s*(?:[-*\u2022]\s+|\d+[.)]\s+)?(.{1,70}?)\s*(?:::|:|=|\s[-\u2013\u2014]\s|\u2192|->)\s*(\S.*)$/;

  if (rows.length < 3) return null;

}

function aiErr(e) {

function parseLoose(text) {
  const t = String(text || '').trim();
  const tryP = s => { try { return JSON.parse(s); } catch (e) { return undefined; } };
  let v = tryP(t);
  if (v !== undefined) return v;
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (f) { v = tryP(f[1].trim()); if (v !== undefined) return v; }
  const a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  if (a >= 0 && b > a) { v = tryP(t.slice(a, b + 1)); if (v !== undefined) return v; }
  return undefined;
}
async function askJSON(prompt, opts) {
  const res = await AI.fn(prompt, opts || {});
  const v = parseLoose(res.text);
  if (v === undefined) throw { code: 'invalid_json', text: res.text };
  return v;
}
function lineEater(onObj) {
  let pend = '';
  const eat = line => {
    let s = line.trim();
    if (!s || s.startsWith('```')) return;
    s = s.replace(/^[\[,]\s*/, '').replace(/,\s*$/, '').replace(/\]\s*$/, '');
    if (!s.startsWith('{')) return;
    try { onObj(JSON.parse(s)); } catch (e) {}
  };
  return {
    push(delta) { const parts = (pend + delta).split('\n'); pend = parts.pop(); parts.forEach(eat); },
    end() { if (pend.trim()) eat(pend); pend = ''; }
  };
}

function genPrompt(o) {
  const L = [];
  L.push('You are writing quiz questions for one student, from their own study material.');
  L.push('');
  L.push('Write ' + o.n + ' questions that test the MATERIAL below.');
  L.push('Rules:');
  L.push('- Ground every question and every answer in the material. Add no outside facts.');
  if (o.syllabus) L.push('- A SYLLABUS is included. Give priority to what it asks the student to know, and phrase questions the way an exam on that syllabus would.');
  L.push('- One fact or idea per question. Mix the kinds: definitions, causes and effects, comparisons, applications, numbers, sequences.');
  L.push('- The question must make sense on its own, without seeing the material.');
  L.push('- "a" is the ideal short answer: a term, name, number or short phrase of at most 8 words wherever the material allows it.');
  L.push('- "alts" lists other wordings a fair marker would accept (abbreviations, synonyms, alternative spellings). Use [] when there are none.');
  L.push('- "d" holds exactly 3 wrong options for a multiple-choice version. Make them plausible, the same kind and length as the answer, and clearly wrong to someone who knows the material. Never use "all of the above" or "none of the above".');
  L.push('- "topic" is a label of 1 to 3 words. Reuse one label for related questions.' + (o.topicNames && o.topicNames.length ? ' Labels already in use: ' + o.topicNames.join('; ') + '.' : ''));
  L.push('- "why" is one sentence that explains the answer, shown after the student responds.');
  L.push('- Write in the language of the material.');
  if (o.lessonTitle) L.push('- Every question must belong to this lesson: "' + o.lessonTitle + '".');
  if (o.topics && o.topics.length) L.push('- The student is weakest on: ' + o.topics.join('; ') + '. Spend most questions there, from new angles.');
  if (o.focus) L.push('- The student asked for this focus: ' + o.focus);
  if (o.existing && o.existing.length) {
    L.push('- Do not repeat or lightly reword these existing questions:');
    for (const q of o.existing) L.push('  * ' + String(q).slice(0, 110));
  }
  L.push('');
  L.push('Output format: one JSON object per line and nothing else. No code fence, no numbering, no commentary. Each line looks like:');
  L.push('{"q":"...","a":"...","alts":["..."],"d":["...","...","..."],"topic":"...","why":"..."}');
  if (o.syllabus) { L.push(''); L.push('SYLLABUS'); L.push(String(o.syllabus).slice(0, 8000)); }

async function aiGenerate(o) {
  let count = 0;
  const eater = lineEater(obj => { count++; o.onCard(obj); });
  const res = await AI.fn(genPrompt(o), { signal: o.signal, modelTier: 'default', cache: false, onText: u => eater.push(u.delta) });
  eater.end();
  if (!count) {
    const v = parseLoose(res.text);
    if (Array.isArray(v)) for (const x of v) { count++; o.onCard(x); }
  }
  return count;
}

function flashBolt(cv) {
  const t0 = performance.now();
  if (calm() || (cv._flash && t0 - cv._flash < 700)) return;
  cv._flash = t0;
  const key = cv.dataset.bolt, g = parseFloat(cv.dataset.g) || 0;
  const step = t => {
    if (!cv.isConnected) return;
    const k = (t - t0) / 560;
    if (k >= 1) return drawBolt(cv, key, g);
    drawBolt(cv, key, g, { flash: (1 - k) * (0.6 + 0.4 * Math.sin(k * 44)), reach: Math.min(1, k / 0.22) });
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function countUp(el) {
  const to = parseFloat(el.dataset.count), node = el.firstChild;
  if (!isFinite(to) || to <= 0 || !node || node.nodeType !== 3) return;
  const t0 = performance.now();
  const step = t => {
    if (!el.isConnected) return;
    const k = clamp((t - t0) / 750, 0, 1);
    node.nodeValue = String(Math.round(to * (1 - Math.pow(1 - k, 3))));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
/* a freshly opened screen rises into place piece by piece; meters, rings and bars fill as it lands */
let enterT = 0;
function playEnter(v) {
  if (calm()) return;
  const els = [];
  for (const el of Array.from(v.children)) { if (el.classList.contains('home')) els.push.apply(els, Array.from(el.children)); else els.push(el); }
  els.push.apply(els, $$('.subgrid > *, .deckgrid > *', v));
  els.forEach((el, i) => { el.classList.add('enter-item'); el.style.animationDelay = Math.min(i, 14) * 42 + 'ms'; });
  v.classList.add('enter');
  clearTimeout(enterT);
  enterT = setTimeout(() => {
    v.classList.remove('enter');
    els.forEach(el => { el.classList.remove('enter-item'); el.style.animationDelay = ''; });
  }, 1250);
  $$('[data-count]', v).forEach(countUp);
}
/* changing subject: a charge runs along the tab strip and the logo jolts while the colours morph */
function zap() {
  if (calm()) return;
  const app = $('#app');
  app.classList.remove('zapped');
  void app.offsetWidth;
  app.classList.add('zapped');
  clearTimeout(zap.t);

}

/* ----- shell painting ----- */
function paintSync() {
  const state = S.mode === 'boot' ? ['', 'Opening'] : S.mode === 'local' ? ['', 'This browser only'] : S.dead ? ['bad', 'Sync stopped'] : S.err ? ['bad', 'Not saved yet'] : S.pending ? ['busy', 'Saving'] : S.stale ? ['busy', 'Connecting'] : ['ok', 'Synced to your account'];
  ['#sync-rail', '#sync-prefs'].forEach(sel => { const el = $(sel); if (!el) return; el.className = 'sync ' + state[0]; el.lastElementChild.textContent = state[1]; });
}
function paintRail() {

    rank.innerHTML = `<canvas data-bolt="rank-${S.uid || 'local'}" data-g="${clamp(0.12 + lv.lv / 24, 0, 1).toFixed(3)}"></canvas><div style="min-width:0"><b>Level ${lv.lv}</b><div class="meter"><i style="width:${pct(lv.p)}%"></i></div><span class="num">${lv.xp - lv.lo}/${lv.hi - lv.lo} XP</span></div>`;
    drawBolts(rank);
  }
  const off = !aiOK();
  ['#rail-claude', '#top-claude'].forEach(sel => { const el = $(sel); if (el) el.disabled = S.ready && off; });
}
function render(anim) {
  const r = UI.route, v = $('#view');
  $$('[data-nav]').forEach(a => { if (a.dataset.nav === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  $('#app').classList.toggle('focus', r === 'study' && !!UI.sess);
  if (!S.ready) return;
  const views = { home: viewHome, study: viewStudy, learn: viewLearn, library: viewLibrary, prefs: viewPrefs };
  v.innerHTML = (views[r] || viewHome)();

/* ----- writing questions with Claude ----- */
async function generate(did, o) {
  o = o || {};
  if (UI.build && UI.build.status === 'run') { toast('Claude is already writing questions. Give it a moment.'); return false; }
  if (!aiOK()) { toast('Claude is not available in this view.'); return false; }
  const b = UI.build = { did, target: o.n || 20, got: 0, status: 'run', msg: 'Reading your material', recent: [], ctl: new AbortController(), quiet: !!o.quiet, topic: o.lessonTitle ? o.lessonTitle.slice(0, 40) : '' };
  paintBuild();
  let before = -1;
  try {
    const src = await Store.loadSrc(did), cards = await Store.loadCards(did), meta = S.decks[did];
    before = cards.length;
    const material = o.text != null ? o.text : src.parts.map(p => '## ' + p.name + '\n' + p.text).join('\n\n');
    if (!material.trim()) throw { code: 'no_material' };
    const secs = o.lessonTitle ? [pickExcerpts(material, o.lessonTitle + ' ' + (o.focus || ''), 12000)] : splitSections(material, 9000);
    const calls = Math.min(secs.length, Math.max(1, Math.ceil(b.target / 10)), 6);
    const start = o.text != null || o.lessonTitle ? 0 : (meta.cursor | 0) % secs.length;
    const seen = new Set(cards.map(c => norm(c.q)));
    for (let k = 0; k < calls && !b.ctl.signal.aborted; k++) {
      const want = Math.ceil((b.target - b.got) / (calls - k));
      if (want <= 0) break;
      b.msg = calls > 1 ? 'Writing from part ' + (k + 1) + ' of ' + calls : 'Writing questions';
      paintBuild();
      await aiGenerate({
        material: secs[(start + Math.floor(k * secs.length / calls)) % secs.length], syllabus: src.syllabus, n: want,
        focus: o.focus || '', topics: o.topics || [], lessonTitle: o.lessonTitle || '',
        existing: cards.slice(-50).map(c => c.q), topicNames: Array.from(new Set(cards.map(c => c.topic))).slice(0, 30), signal: b.ctl.signal,
        onCard: raw => {
          const c = cleanCard(raw);
          if (!c || b.got >= b.target + 4) return;
          const key = norm(c.q);
          if (seen.has(key)) return;
          seen.add(key);
          if (b.topic) c.topic = b.topic;
          cards.push(c);
          b.got++;
          b.recent.unshift(c.q);
          b.recent.length = Math.min(b.recent.length, 3);
          const s = UI.sess;
          if (s && s.did === did && !s.only && (!s.topics.length || s.topics.includes(c.topic))) s.pool.push(c);
          paintBuild();
        }
      });
    }
    if (o.text == null && !o.lessonTitle) meta.cursor = start + calls;
    b.status = b.ctl.signal.aborted ? 'stopped' : b.got ? 'done' : 'err';
    if (b.status === 'err') b.msg = 'Nothing usable came back. Try again, or add more material.';
  } catch (e) {
    b.status = e && e.code === 'cancelled' ? 'stopped' : 'err';
    b.msg = aiErr(e) || 'Stopped.';
  }
  const all = S.cards[did];
  if (all && before >= 0 && all.length !== before) await Store.saveCards(did, before);
  paintBuild();
  const onBuild = !b.quiet && UI.route === 'library' && UI.lib.mode === 'build' && UI.lib.did === did;
  if (b.got && (b.quiet || !onBuild)) toast(b.quiet ? '+' + b.got + ' fresh questions in play' : plural(b.got, 'question') + ' ready in ' + ((S.decks[did] || {}).name || 'your deck'));
  else if (b.status === 'err' && !onBuild && !b.quiet) toast(b.msg);
  if (!onBuild) softRender();
  return b.got > 0;
}

  n.innerHTML = b.got + '<small>/ ' + b.target + '</small>';

  return Chat.free[did] || (Chat.free[did] = { kind: 'free', did: did || null, turns: [] });
}
function paintChat() {
  const th = Chat.thread;
  if (!th) return;
  $('#mc-ctx').textContent = th.kind === 'quiz' ? 'On your current question' : th.kind === 'lesson' ? th.title : th.kind === 'review' ? 'Going over your misses' : th.did && S.decks[th.did] ? S.decks[th.did].name : 'Your teacher';
  const tools = $('#mc-tools'), l = lessonOf(th);
  tools.hidden = th.kind !== 'lesson';
  tools.innerHTML = th.kind === 'lesson' ? `<button class="btn sm" data-act="lesson-quiz" ${Chat.busy ? 'disabled' : ''}>${ic('bolt')}Quiz me on this</button><button class="btn sm" data-act="lesson-done">${ic('check')}${l && l.st === 2 ? 'Done' : 'Mark as done'}</button>` : '';
  const msgs = th.turns.map(t => t.role === 'user' ? (t.auto ? '' : '<div class="msg me">' + esc(t.content) + '</div>') : '<div class="msg ai"><p class="lbl who">Mr Claude</p><div class="prose">' + md(t.content) + '</div></div>').join('');
  const empty = `<div class="mc-empty"><canvas data-bolt="mr-claude" data-g="0.85"></canvas><p>${aiOK() ? (th.kind === 'quiz' ? 'Stuck on this one? Ask for a hint, or for the idea behind it. The answer stays hidden until you ask for it.' : 'Ask about anything in your notes. Answers draw on the material and syllabus in this deck.') : 'Mr Claude is not available in this view. Open the page inside Claude and allow it to use Claude.'}</p></div>`;
  const log = $('#mc-log');
  log.innerHTML = (msgs || (Chat.busy ? '' : empty)) +
    (Chat.busy ? '<div class="msg ai"><p class="lbl who">Mr Claude</p><div class="prose" id="mc-live"><p class="checking"><span class="dots"><i></i><i></i><i></i></span>Thinking</p></div></div>' : '') +
    (Chat.err ? '<div class="msg err">' + esc(Chat.err) + '</div>' : '');
  drawBolts(log);
  log.scrollTop = log.scrollHeight;
  $('#mc-quick').innerHTML = Chat.busy || !aiOK() ? '' : quickPrompts(th).map(q => `<button class="chip" data-act="chat-quick" data-q="${esc(q)}"><span>${esc(q)}</span></button>`).join('');
  const send = $('#mc-send');
  send.innerHTML = ic(Chat.busy ? 'stop' : 'up');
  send.setAttribute('aria-label', Chat.busy ? 'Stop' : 'Send');
  send.disabled = !aiOK();
}
async function chatSend(text, auto) {
  const th = Chat.thread;
  text = String(text || '').trim();
  if (!th || Chat.busy || !text) return;
  if (!aiOK()) { toast('Mr Claude is not available in this view.'); return; }
  th.turns.push({ role: 'user', content: text, auto: !!auto });
  Chat.busy = true; Chat.err = '';
  const ctl = Chat.ctl = new AbortController();
  paintChat();
  const pace = S.profile.prefs.pace;
  const tier = pace === 'deep' ? 'complex' : pace === 'thorough' || th.kind === 'lesson' ? 'default' : 'quick';
  try {
    const rules = await chatRules(th, text);
    const hist = th.turns.slice(-14).map(t => ({ role: t.role, content: String(t.content).slice(0, 8000) }));
    const res = await AI.fn([{ role: 'user', content: rules }].concat(hist), {
      cache: false, signal: ctl.signal, modelTier: tier,
      onText: u => {
        if (Chat.thread !== th) return;
        const el = $('#mc-live'), log = $('#mc-log');
        if (!el) return;
        const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
        el.innerHTML = md(u.text);
        if (stick) log.scrollTop = log.scrollHeight;
      }
    });
    th.turns.push({ role: 'assistant', content: res.text });
    if (res.truncated) Chat.err = 'That reply was cut short. Ask for the rest, or for less at a time.';
  } catch (e) {
    const keep = e && e.code !== 'refused' && e.text ? String(e.text) : '';
    if (keep) th.turns.push({ role: 'assistant', content: keep });
    else if (auto) th.turns.pop();
    Chat.err = aiErr(e) || (keep ? '' : '');
  }
  Chat.busy = false; Chat.ctl = null;
  if (th.kind === 'lesson' && th.turns.length) Store.saveLesson(th.did, th.lesson.id, th.turns);
  if (Chat.thread === th) paintChat();
  paintRail();
}

/* ----- actions ----- */
function setStudy(patch) { Object.assign(S.profile.study, patch); Store.touchActive(); render(); }
function setPref(patch) { Object.assign(S.profile.prefs, patch); Store.touchPrefs(); applyLook(); render(); }
const ACT = {
  go: el => go(el.dataset.to),
  'open-claude': () => openChat(defaultThread()),
  'close-claude': () => closeChat(),
  'chat-quick': el => chatSend(el.dataset.q),
  'new-deck': () => openNewDeck(),
  sample: () => makeSample(),
  'set-active': el => { setActive(el.dataset.did); render(true); $('#main').scrollTop = 0; },
  'quick-start': () => startSession({ did: activeDeck() }),
  drill: el => startSession({ did: activeDeck(), topics: [el.dataset.topic], mode: 'endless', focus: 'weak' }),
  'retry-cards': el => { delete cardErr[el.dataset.did]; render(); },

  'st-deck': el => { UI.setup = { did: el.dataset.did, topics: [] }; render(); },
  'st-mode': el => setStudy(el.dataset.mode === 'quiz' ? { mode: 'quiz', len: Number(el.dataset.len) } : { mode: 'endless' }),
  'st-fmt': el => { const k = el.dataset.f, st = S.profile.study, other = k === 'mc' ? 'sa' : 'mc'; if (st[k] && !st[other]) return toast('Keep at least one format on.'); setStudy({ [k]: !st[k] }); },
  'st-focus': el => setStudy({ focus: el.dataset.f }),
  'st-topic': el => { const t = el.dataset.t, su = UI.setup; if (!t) su.topics = []; else if (su.topics.includes(t)) su.topics = su.topics.filter(x => x !== t); else su.topics.push(t); render(); },
  'st-topup': () => setStudy({ topup: !S.profile.study.topup }),
  start: () => startSession({ did: UI.setup.did, topics: UI.setup.topics.slice() }),

  pick: el => pickOption(Number(el.dataset.i)),
  idk: () => { const c = UI.sess && UI.sess.cur; if (c && c.state === 'ask') { c.user = ''; settle({ g: 0, kind: 'wrong' }); } },
  next: () => nextQuestion(),
  override: el => overrideMark(Number(el.dataset.g)),
  self: el => selfMark(Number(el.dataset.g)),
  'ask-claude': () => openChat(defaultThread()),
  'ask-why': () => { const c = UI.sess && UI.sess.cur; if (!c) return; openChat(defaultThread()); chatSend(c.verdict && c.verdict.g >= 2 ? 'Why is that the answer?' : 'Why is \u201c' + c.card.a + '\u201d the answer, and where did I go wrong?'); },
  'end-session': () => finishSession(),
  again: () => startSession(UI.done.cfg),
  'drill-misses': () => { const r = UI.done; startSession({ did: r.did, only: r.misses.map(m => m.id), mode: 'quiz', len: r.misses.length, topics: [] }); },
  'ask-misses': () => { const r = UI.done; openChat({ kind: 'review', did: r.did, misses: r.misses, turns: [] }); chatSend('Help me understand what I got wrong.'); },
  'done-home': () => { UI.done = null; go('home'); },

  'ln-deck': el => { UI.learn = el.dataset.did; render(); },
  'syl-edit': () => editSyllabus(),
  'plan-build': () => { const d = S.decks[UI.learn]; if (d && (d.plan || []).some(l => l.st)) confirmSheet('Rebuild the plan?', 'Lessons whose titles stay the same keep their progress. Others start fresh.', 'Rebuild', () => { closeSheet(); buildPlan(); }); else buildPlan(); },
  'lesson-open': el => openLesson(el.dataset.id),
  'lesson-quiz': () => lessonQuiz(),
  'lesson-done': () => { const th = Chat.thread, l = lessonOf(th); if (!l) return; l.st = 2; Store.saveDeck(th.did); toast('Lesson marked as done'); closeChat(); },
  'ask-deck': () => openChat(defaultThread()),

  'lib-open': el => { UI.lib = { mode: 'deck', did: el.dataset.did, q: '' }; followDeck(el.dataset.did); render(true); $('#main').scrollTop = 0; },
  sub: el => selectSub(el.dataset.id),
  'sub-add': () => subjectSheet(null),
  'sub-edit': el => subjectSheet(el.dataset.id),
  'sj-color': el => { if (UI.sheet && UI.sheet.setC) UI.sheet.setC(el.dataset.c); },
  'nd-sub': el => { const id = el.dataset.id; UI.nd.sub = id; S.profile.sub = id || null; Store.touchActive(); applyLook(); paintSubs(); paintNewDeck(); },
  'deck-move': el => { const did = UI.lib.did, d = S.decks[did], id = el.dataset.id; if (!d) return; if (S.subs[id]) d.sub = id; else delete d.sub; Store.saveDeck(did); setActive(did); followDeck(did); render(); toast(S.subs[id] ? 'Moved to ' + S.subs[id].name : 'Moved out of its subject'); },
  'lib-back': () => { UI.lib = { mode: 'list', did: null, q: '' }; UI.nd = null; render(true); $('#main').scrollTop = 0; },
  'nd-file': () => $('#nd-files').click(),
  'nd-sylfile': () => $('#nd-sylfile').click(),
  'nd-rm': el => { UI.nd.files.splice(Number(el.dataset.i), 1); paintNewDeck(); },
  'nd-mode': el => { UI.nd.mode = el.dataset.m; paintNewDeck(); },
  'nd-opt': el => { const k = el.dataset.k; UI.nd[k] = !UI.nd[k]; if (k === 'header') UI.nd.headerSet = true; paintNewDeck(); },
  'nd-count': el => { UI.nd.count = Number(el.dataset.n); paintNewDeck(); },
  'nd-build': () => ndBuild(),
  'build-stop': () => { if (UI.build && UI.build.ctl) UI.build.ctl.abort(); },
  'build-study': () => { const b = UI.build; startSession(b.topic ? { did: b.did, topics: [b.topic], mode: 'quiz', len: 10 } : { did: b.did }); },
  'build-done': () => { UI.lib = { mode: 'deck', did: UI.build.did, q: '' }; render(); },
  'deck-study': () => { UI.setup = { did: UI.lib.did, topics: [] }; go('study'); },
  'deck-rename': () => { const did = UI.lib.did; openSheet({ title: 'Rename deck', html: `<label class="field"><span class="lbl">Name</span><input class="inp" id="rn-name" maxlength="60" value="${esc(S.decks[did].name)}"></label>`, acts: [{ label: 'Cancel', cls: 'ghost' }, { label: 'Save', cls: 'pri', fn: () => { const v = $('#rn-name').value.trim(); if (!v) return false; S.decks[did].name = v.slice(0, 60); Store.saveDeck(did); closeSheet(); render(); } }] }); },
  'src-add': () => addMaterial(),
  'am-file': () => $('#am-file').click(),
  'sy-file': () => $('#sy-file').click(),
  'src-rm': el => { const did = UI.lib.did, id = el.dataset.id; confirmSheet('Remove this source?', 'Questions already written from it stay in the deck. Claude will no longer draw on this text.', 'Remove', async () => { closeSheet(); await Store.removeSrc(did, id); render(); }, true); },
  'gen-more': () => writeMore(),
  'wm-n': el => { if (UI.sheet && UI.sheet.setN) UI.sheet.setN(Number(el.dataset.n)); },
  'card-add': () => addCard(),
  'card-edit': el => editCard(el.dataset.id),
  'deck-reset': () => { const did = UI.lib.did; confirmSheet('Reset progress?', 'Every question in this deck goes back to new. Your questions and material stay.', 'Reset', async () => { closeSheet(); await Store.resetProg(did); render(); toast('Progress reset'); }, true); },
  'deck-del': () => { const did = UI.lib.did; confirmSheet('Delete this deck?', 'The questions, material, lessons and progress for \u201c' + S.decks[did].name + '\u201d are removed from every device. This cannot be undone.', 'Delete deck', async () => { closeSheet(); UI.lib = { mode: 'list', did: null, q: '' }; if (UI.build && UI.build.did === did && UI.build.ctl) UI.build.ctl.abort(); await Store.deleteDeck(did); render(); toast('Deck deleted'); }, true); },

  'pf-preset': el => { const k = el.dataset.k, p = PRESETS[k]; setPref({ preset: k, a1: p[0], a2: p[1] }); },
  'pf-flat': el => setPref({ flat: el.dataset.v === '1' }),
  'pf-look': el => setPref({ look: el.dataset.v }),
  'pf-toggle': el => { const k = el.dataset.k, v = !S.profile.prefs[k]; setPref({ [k]: v }); if (k === 'sound' && v) ping(true); },
  'pf-goal': el => { S.profile.goal = Number(el.dataset.n); Store.touchPrefs(); render(); },
  'pf-typo': el => setPref({ typo: el.dataset.v }),
  'pf-pace': el => setPref({ pace: el.dataset.v }),

  'sheet-bg': (el, e) => { if (e.target === el) closeSheet(); },
  'sheet-do': async el => { const a = UI.sheet && UI.sheet.acts[Number(el.dataset.i)]; if (!a) return; if (!a.fn) return closeSheet(); await a.fn(); }
};

document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) {
    if (nav.dataset.nav === UI.route) {
      e.preventDefault();
      if (UI.route === 'library') { UI.lib = { mode: 'list', did: null, q: '' }; UI.nd = null; }
      if (UI.route === 'study' && !UI.sess) UI.done = null;
      render();
      $('#main').scrollTop = 0;
    }
    return;
  }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'sa-form') submitTyped($('#sa-in').value);
  else if (e.target.id === 'mc-form') {
    if (Chat.busy) { if (Chat.ctl) Chat.ctl.abort(); return; }
    const ta = $('#mc-in'), v = ta.value;
    if (!v.trim()) return;
    ta.value = ''; ta.style.height = '';
    chatSend(v);
  }
});
document.addEventListener('keydown', e => {
  const t = e.target, tag = t && t.tagName;
  if (e.key === 'Escape') { if (UI.sheet) closeSheet(); else if (Chat.open) closeChat(); return; }
  if (t && t.id === 'mc-in' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    const f = $('#mc-form');
    if (f.requestSubmit) f.requestSubmit(); else f.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
    return;
  }
  if (/^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/.test(tag || '') || UI.sheet || e.metaKey || e.ctrlKey || e.altKey) return;
  const c = UI.sess && UI.route === 'study' && UI.sess.cur;
  if (!c) return;
  if (c.fmt === 'mc' && c.state === 'ask' && /^[1-4]$/.test(e.key)) { e.preventDefault(); pickOption(Number(e.key) - 1); }
  else if (c.state === 'done' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); nextQuestion(); }
});
const saveLookSoon = debounce(() => Store.touchPrefs(), 500);
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'lib-q') { UI.lib.q = t.value; const l = $('#card-list'); if (l) l.innerHTML = cardRows(UI.lib.did, filterCards(UI.lib.did)); }
  else if (t.id === 'nd-text') ndDetectSoon();
  else if (t.id === 'mc-in') { t.style.height = 'auto'; t.style.height = Math.min(136, t.scrollHeight + 2) + 'px'; }
  else if (t.id === 'pf-a1' || t.id === 'pf-a2') { const p = S.profile.prefs; p[t.id.slice(3)] = t.value; p.preset = 'custom'; applyLook(); saveLookSoon(); }
  else if (t.id === 'sj-name') { const el = $('#sj-prev-name'); if (el) el.textContent = t.value.trim() || 'New subject'; }
  else if (t.id === 'sj-c') { if (UI.sheet && UI.sheet.setC) UI.sheet.setC(t.value); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.type !== 'file') { if (t.id === 'pf-a1' || t.id === 'pf-a2') render(); return; }
  const files = Array.from(t.files || []);
  t.value = '';
  if (!files.length) return;
  if (t.id === 'nd-files') ndAddFiles(files);
  else if (t.id === 'nd-sylfile') readInto(files[0], $('#nd-syl'));
  else if (t.id === 'sy-file') readInto(files[0], $('#sy-text'));
  else if (t.id === 'am-file') { const nm = $('#am-name'); if (nm && !nm.value.trim()) nm.value = prettyName(files[0].name); readInto(files[0], $('#am-text')); }
});
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#nd-drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#nd-drop'); if (d && !d.contains(e.relatedTarget)) d.classList.remove('over'); });
document.addEventListener('drop', e => {
  const d = e.target.closest && e.target.closest('#nd-drop');
  if (!d) return;
  e.preventDefault();
  d.classList.remove('over');
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) ndAddFiles(e.dataTransfer.files);
});
window.addEventListener('hashchange', onRoute);
window.addEventListener('resize', debounce(() => drawBolts(), 180));
document.addEventListener('visibilitychange', () => { if (document.hidden) Store.flush(); });
window.addEventListener('pagehide', () => Store.flush());

/* ----- boot ----- */
function saveCopy(code) {
  if (code === 'quota_exceeded') return 'Storage for this page is full. Delete a deck you no longer need.';
  if (code === 'revoked' || code === 'not_granted') return 'Saving to your account was switched off. Reload the page to reconnect.';
  return 'A change could not be saved. Check your connection; it goes out again with your next answer.';
}
function boot() {
  const links = NAV.map(n => `<a href="#${n[0]}" data-nav="${n[0]}">${ic(n[2])}<span>${n[1]}</span></a>`).join('');
  $('#nav-rail').innerHTML = links;
  $('#nav-tabs').innerHTML = links;
  $('#top-claude').innerHTML = ic('chat');
  $('#mc-close').innerHTML = ic('x');
  $('#mc-send').innerHTML = ic('up');
  try { const c = JSON.parse(localStorage.getItem('rime:look') || 'null'); if (c && typeof c === 'object') Object.assign(S.profile.prefs, c); } catch (e) {}
  applyLook(true);
  drawBolts();
  let shown = false;
  onStore = (kind, code) => {
    if (kind === 'sync') return paintSync();
    if (kind === 'fail') { paintSync(); return toast(saveCopy(code), 4200); }
    applyLook();
    if (S.ready && !shown) { shown = true; render(true); }
    else if (kind !== 'same') softRender();   // an echo of our own save changes nothing on screen
    paintSubs(); paintRail(); paintSync();
  };
  const r = (location.hash || '#home').slice(1);
  UI.route = NAV.some(n => n[0] === r) ? r : 'home';
  render();
  paintSync();
  Store.boot();
  bootAI().then(() => { paintRail(); softRender(); });
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)'), on = () => applyLook();
    if (mq.addEventListener) mq.addEventListener('change', on); else if (mq.addListener) mq.addListener(on);
  }
  new MutationObserver(() => applyLook()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}
boot();

})();
</script>
