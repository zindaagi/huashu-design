<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ringgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--a1)"></stop>
      <stop offset="1" style="stop-color:var(--a2)"></stop>
    </linearGradient>
  </defs>
</svg>

<div id="glow" aria-hidden="true"></div>

<div class="app" id="app">
  <nav class="rail" aria-label="Main">
    <a class="logo" href="#home" aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.6 1.5 3.8 13.6h6.3L8.4 22.5 20.2 9.4h-6.6z" fill="url(#ringgrad)"></path></svg>
    </a>
    <div class="nav" id="nav-rail"></div>
    <button class="btn" data-act="open-claude" id="rail-claude">Ask BOLT</button>
    <div class="rail-foot">
      <div class="rank" id="rank"></div>
      <div class="sync" id="sync-rail"><i></i><span>Opening</span></div>
    </div>
  </nav>

  <header class="top">
    <a class="logo" href="#home" aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.6 1.5 3.8 13.6h6.3L8.4 22.5 20.2 9.4h-6.6z" fill="url(#ringgrad)"></path></svg>
    </a>
    <div class="subs grow" id="subs-top" role="group" aria-label="Subjects"></div>
    <button class="btn sm" data-act="open-claude" aria-label="Ask BOLT" id="top-claude"></button>
  </header>

  <div class="subbar"><div class="subs" id="subs-bar" role="group" aria-label="Subjects"></div></div>

  <main class="main" id="main">
    <div class="wrap" id="view">
      <div class="boot">
        <div>
          <canvas id="boot-art" data-bolt="boot" data-g="1" width="120" height="120"></canvas>
          <p class="lbl">Opening your library</p>
        </div>
      </div>
    </div>
  </main>

  <nav class="tabs" id="nav-tabs" aria-label="Main"></nav>
</div>

<aside class="mc" id="mc" aria-label="BOLT" aria-hidden="true">
  <div class="mc-h">
    <div class="grow">
      <b>BOLT</b>
      <p class="lbl" id="mc-ctx">Your teacher</p>
    </div>
    <button class="btn sm ghost" data-act="close-claude" aria-label="Close BOLT" id="mc-close"></button>
  </div>
  <div class="mc-tools" id="mc-tools" hidden></div>
  <div class="mc-log" id="mc-log" aria-live="polite"></div>
  <div class="mc-quick" id="mc-quick"></div>
  <form class="mc-form" id="mc-form">
    <textarea id="mc-in" rows="1" placeholder="Ask anything about this" aria-label="Message BOLT" enterkeyhint="send"></textarea>
    <button class="btn pri" type="submit" id="mc-send" aria-label="Send"></button>
  </form>
</aside>

<div id="sheet-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>
